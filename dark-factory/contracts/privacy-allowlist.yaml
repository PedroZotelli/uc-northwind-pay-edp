# Dark Factory privacy allowlist.
#
# Layer 2 of the three-layer privacy boundary described in DR-004. Every leaf
# path a finding may contain is enumerated here with the value class permitted
# at that path. A leaf whose path is absent, or whose value does not match its
# declared class, is a DF-E-PRIVACY-VIOLATION and the finding is not written.
#
# This is a positive allowlist. A value is safe because it was approved here,
# never because it failed to look dangerous. The Type 01 "approved safe
# transaction reference" that legacy may retain in its own evidence is
# deliberately absent: the detector has no use for it and therefore never
# carries it.
#
# Array elements are addressed with "[]".

version: 1

value_classes:
  boolean:
    kind: boolean
  count:
    kind: integer
    minimum: 0
    maximum: 999999999
  digest:
    kind: string
    pattern: "^sha256:[0-9a-f]{64}$"
  batch-id:
    kind: string
    pattern: "^B[0-9]{15}$"
  control-name:
    kind: string
    pattern: "^[a-z][a-z0-9_]{0,48}$"
  control-value:
    kind: string
    pattern: "^(-?[0-9]+\\.[0-9]{2}|[0-9]{1,9})$"
  contract-code:
    kind: string
    pattern: "^[A-Z0-9_]{1,16}$"
  layout-version:
    kind: string
    pattern: "^[0-9]{3}$"
  type-number:
    kind: string
    pattern: "^0[1-5]$"
  detector-version:
    kind: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  timestamp:
    kind: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  schema-version:
    kind: string
    enum: ["1.0.0"]
  finding-code:
    kind: string
    enum: ["DF-SOURCE-CONTROL-MISMATCH"]
  scenario:
    kind: string
    enum:
      - DF-SOURCE-001
      - DF-SOURCE-002
      - DF-SOURCE-003
      - DF-SOURCE-004
      - DF-SOURCE-005
  value-class:
    kind: string
    enum: ["count", "money"]
  terminal-status:
    kind: string
    enum: ["quarantined"]
  terminal-stage:
    kind: string
    enum: ["java-validation"]
  terminal-code:
    kind: string
    enum:
      - SOURCE_CONTROL_TOTAL_MISMATCH
      - SOURCE_CONTROL_NET_MISMATCH
      - SOURCE_CONTROL_ASSESSED_FEE_MISMATCH
  quarantine-scope:
    kind: string
    enum: ["batch"]
  peer-status:
    kind: string
    enum: ["succeeded", "quarantined", "oracle_mismatch"]
  reconciliation-status:
    kind: string
    enum: ["MATCHED", "MISMATCHED", "ABSENT"]
  attribution-owner:
    kind: string
    enum: ["source_system_of_record", "undetermined"]
  attribution-confidence:
    kind: string
    enum: ["conclusive", "inconclusive"]
  attribution-rule:
    kind: string
    enum:
      - declaration-source-owned-and-consistent
      - independent-computation-agreement
      - declared-differs-from-computed
  channel:
    kind: string
    enum:
      - legacy-source-manifest
      - legacy-java-processor
      - legacy-postgres-diagnostic
      - legacy-postgres-control-plane
      - legacy-sftp-transport
      - legacy-contract-oracle
  observation-role:
    kind: string
    enum:
      - system_of_record
      - source_of_observation
      - source_of_correctness
  independence:
    kind: string
    enum:
      - source_declaration
      - independent_computation
      - persisted_record
      - derived_projection
      - transport_observation
      - contract_comparison
  detector-name:
    kind: string
    enum: ["northwind-pay-dark-factory-source-control-detector"]
  comparison-method:
    kind: string
    enum: ["declared-versus-independently-computed-controls"]
  request-state:
    kind: string
    enum: ["not_requested"]

paths:
  schema_version: schema-version
  finding_version: count
  finding_code: finding-code
  finding_id: digest
  scenario: scenario
  created_at: timestamp

  batch.batch_id: batch-id
  batch.type_number: type-number
  batch.contract_code: contract-code
  batch.contract_version: count
  batch.layout_version: layout-version

  controls.difference_count: count
  controls.compared[].control: control-name
  controls.compared[].value_class: value-class
  controls.compared[].declared: control-value
  controls.compared[].computed: control-value
  controls.compared[].matches: boolean

  terminal.status: terminal-status
  terminal.stage: terminal-stage
  terminal.code: terminal-code

  isolation.observed: boolean
  isolation.quarantine_scope: quarantine-scope
  isolation.raw_quarantine_present: boolean
  isolation.sanitized_csv_present: boolean
  isolation.postgres_business_mutation: boolean
  isolation.staging_row_count: count
  isolation.business_row_count: count

  continuation.observed: boolean
  continuation.peers[].batch_id: batch-id
  continuation.peers[].status: peer-status
  continuation.peers[].reconciliation_status: reconciliation-status

  attribution.owner: attribution-owner
  attribution.confidence: attribution-confidence
  attribution.basis[].rule: attribution-rule
  attribution.basis[].channels[]: channel
  attribution.basis[].satisfied: boolean

  method.detector: detector-name
  method.detector_version: detector-version
  method.comparison: comparison-method

  observations[].channel: channel
  observations[].role: observation-role
  observations[].independence: independence
  observations[].reference: digest

  references.raw_sha256: digest
  references.source_manifest_sha256: digest
  references.contract_oracle_sha256: digest
  references.detector_source_sha256: digest

  approval.state: request-state
  remediation.state: request-state

# Layer 3 of the privacy boundary. Restricted digit identifiers are extracted
# from the frozen raw fixture at detection time and asserted absent from the
# canonical finding bytes and from their digits-only projection, so a leak
# survives neither punctuation nor field boundaries. Tokens are held in memory
# only; they are never written, logged, or included in a violation message.
#
# Only digit identifiers are matched against the corpus. Names and free-text
# descriptions are excluded from a corpus match on purpose: the Type 05 raw
# header uses the same business vocabulary as the control names themselves
# ("gross", "amount", "assessed"), so an alphabetic corpus match reports a
# violation for a value that carries no restricted content. Those classes are
# instead closed off structurally — every string member of a finding is an
# enumerated value, a pattern-bound identity checked against frozen contract
# truth, or a control name derived from a JSON *key* of the legacy processor
# result. A name or description can never become a key, so it has no route in.
restricted_corpus:
  extract:
    - digit-runs-of-length: 11   # CPF
    - digit-runs-of-length: 13   # PAN, short
    - digit-runs-of-length: 14   # CNPJ
    - digit-runs-of-length: 15   # PAN
    - digit-runs-of-length: 16   # PAN
    - digit-runs-of-length: 17   # PAN
    - digit-runs-of-length: 18   # PAN
    - digit-runs-of-length: 19   # PAN
  normalizations:
    - as-is
    - digits-only
