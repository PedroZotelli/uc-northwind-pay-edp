  - scenario: DF-SOURCE-005
    type_number: "05"
    contract_slug: 05-merchant-fee-assessment
    contract_code: MER_FEESET05
    batch_id: B202607230000405
    terminal_code: SOURCE_CONTROL_ASSESSED_FEE_MISMATCH
    terminal_stage: java-validation
    contract_oracle: >-
      contracts/types/05-merchant-fee-assessment/main/expected-df-source-005-finding.yaml
    raw_fixture: contracts/types/05-merchant-fee-assessment/main/df-source-005.csv
    raw_encoding: UTF-8
    staging_relation: staging.merchant_fee_assessment
    operational_relation: legacy.merchant_fee_assessment
    reporting_relation: reporting.merchant_fee_reconciliation
