[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The modern ingestion package. Named for the business domain, not for the
# repository, so it can be installed alongside `datagen` (gen/) without either
# claiming to be "the" NorthWind Pay package.
name = "northwind-pay"
version = "1.0.0"
description = "Modern NorthWind Pay ingestion: parse, validate, and publish canonical Parquet."
requires-python = ">=3.12"

# Deliberately empty. Runtime dependencies are pinned once, for the whole
# modern stack, in modern/requirements.txt. Duplicating them here would create
# a second resolver for the same environment.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.mypy] section on purpose. `make modern-check` invokes mypy from the
# repository root with explicit `--python-version 3.12 --strict --no-incremental`
# flags, so a table here would never be read — and a setting that looks
# authoritative but is ignored is worse than no setting at all.
