version: 2

sources:
  - name: landing
    description: >-
      Immutable sanitized Parquet registered by dlt. Landing is never edited;
      it is the durable artifact and the database is rebuilt from it.
    schema: landing
    tables:
      - name: card_settlement
        description: One privacy-safe Type 01 movement per source detail record.
      - name: card_settlement_control
        description: >-
          Per-batch controls published by the writer. Carries the source-owned
          declaration unchanged, even when it is wrong.
      - name: merchant_fee_assessment
        description: One privacy-safe Type 05 fee assessment per source row.
      - name: merchant_fee_assessment_control
        description: >-
          Per-batch Type 05 controls published by the writer, carrying the
          source-owned declaration unchanged.
