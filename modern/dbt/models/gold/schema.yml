version: 2

models:
  - name: gold_card_settlement_reconciliation
    description: >-
      Grain: one row per batch and currency, matching the legacy reporting
      grain so golden-match compares like with like.
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: ["BRL"]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["MATCHED", "MISMATCHED"]

  - name: gold_merchant_fee_reconciliation
    description: >-
      Grain: one row per Type 05 batch and currency, matching the legacy
      reporting grain.
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: ["BRL"]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["MATCHED", "MISMATCHED"]

  - name: gold_instant_payment_reconciliation
    description: >-
      Grain: one row per Type 02 batch and currency, at the legacy reporting
      grain.
    columns:
      - name: batch_id
        tests: [not_null, unique]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: ["BRL"]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["MATCHED", "MISMATCHED"]
