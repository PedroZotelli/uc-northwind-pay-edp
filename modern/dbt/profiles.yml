# Local-only profile. The lakehouse is a disposable DuckDB file rebuilt from
# the immutable landing Parquet tree, so nothing here is a system of record.
northwind_modern:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('NWP_MODERN_DUCKDB', '../lakehouse/ducklake/northwind_modern.duckdb') }}"
      threads: 1
      schema: main
