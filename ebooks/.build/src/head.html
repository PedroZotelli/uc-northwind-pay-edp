<style>
/* ════════════════════════════════════════════════════════════════════
   CONVERGE ebook — canonical print edition.
   One .slide per PDF page at exactly 1440×900 px, rasterized at 1.5×.
   Design language: the austere editorial deck system of prt-task-spec.html,
   re-identified with the Converge Settlement Fold palette (brf-converge §3):
     violet #A78BFA = Converge brand (sequencing, binding, contracts)
     gold   #F3B64C = HUMAN AUTHORITY ONLY — never decorative
     cyan   #68C7FF = Seamwise topology / TaskPlan / lineage
     green  #3DDC97 = verified / accepted / settled
     red    #FF6B66 = refused / stale / tamper
     silver #CBD3DA = observer / read-only surfaces
   Pages are STATIC: no scroll JS, no reveals; all content visible on load.
   ════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #070A0F; --surface: #0d1117; --surface2: #111720; --surface3: #171E28;
  --border: rgba(245,242,234,0.08); --rule: rgba(245,242,234,0.12);
  --text: #F5F2EA; --text-dim: #8f969f; --text-mute: #59616d;
  --violet: #A78BFA; --violet-deep: #7C5CE0; --violet-ink: #18152a;
  --gold: #F3B64C;   /* RESERVED: human authority (reviewer, key holder, barrier) */
  --cyan: #68C7FF;   /* Seamwise / TaskPlan / lineage */
  --green: #3DDC97;  /* verified / accepted / settled */
  --red: #FF6B66;    /* refused / stale / tamper */
  --silver: #CBD3DA; /* observer / read-only */
  --accent: var(--violet);
  --border-bright: rgba(167,139,250,0.26);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-editorial: 'Newsreader', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'Fira Code', 'SF Mono', Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }
body {
  font-family: var(--font-body); color: var(--text); background: #030405;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding: 28px 0;
}
::selection { background: var(--violet); color: #070A0F; }

/* ── the page ─────────────────────────────────────────────────────── */
.slide {
  position: relative; width: 1440px; height: 900px; overflow: hidden;
  margin: 0 auto 28px; outline: 1px solid #1a212b;
  background: var(--bg);
  padding: 38px 78px 26px;
  display: flex; flex-direction: column;
  isolation: isolate;
  --ac: var(--violet);
}
.slide[data-accent="violet"], .slide[data-accent="purple"] { --ac: var(--violet); }
.slide[data-accent="cyan"]   { --ac: var(--cyan); }
.slide[data-accent="gold"]   { --ac: var(--gold); }
.slide[data-accent="green"]  { --ac: var(--green); }
.slide[data-accent="red"]    { --ac: var(--red); }
.slide[data-accent="silver"] { --ac: var(--silver); }

/* atmosphere — aurora tints are violet + cyan; gold aurora ONLY on
   human-authority pages (barrier, key holder). */
.aurora {
  position: absolute; inset: -10%; z-index: 0; pointer-events: none;
  filter: blur(70px); opacity: 0.5;
  --a1: rgba(167,139,250,0.15); --a2: rgba(104,199,255,0.09); --a3: rgba(61,220,151,0.05);
}
.aurora::before, .aurora::after, .aurora > b { content: ''; position: absolute; border-radius: 50%; mix-blend-mode: screen; }
.aurora::before { width: 660px; height: 660px; left: -6%;  top: -16%;  background: radial-gradient(circle, var(--a1), transparent 62%); }
.aurora::after  { width: 520px; height: 520px; right: -4%; top: 20%;   background: radial-gradient(circle, var(--a2), transparent 62%); }
.aurora > b     { width: 470px; height: 470px; left: 34%;  bottom: -20%; background: radial-gradient(circle, var(--a3), transparent 62%); display: block; }
.aurora--cyan   { --a1: rgba(104,199,255,0.14); --a2: rgba(167,139,250,0.09); --a3: rgba(61,220,151,0.05); }
.aurora--green  { --a1: rgba(61,220,151,0.12); --a2: rgba(104,199,255,0.08); --a3: rgba(167,139,250,0.05); }
.aurora--gold   { --a1: rgba(243,182,76,0.12); --a2: rgba(167,139,250,0.07); --a3: rgba(104,199,255,0.05); }
.aurora--red    { --a1: rgba(255,107,102,0.11); --a2: rgba(167,139,250,0.06); --a3: rgba(104,199,255,0.05); }

.grid-floor {
  position: absolute; left: 50%; bottom: -16%; width: 150%; height: 52%;
  transform: translateX(-50%) perspective(1100px) rotateX(64deg); transform-origin: 50% 0%;
  background-image:
    linear-gradient(rgba(140,150,220,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140,150,220,0.05) 1px, transparent 1px);
  background-size: 58px 58px;
  -webkit-mask-image: radial-gradient(ellipse 56% 90% at 50% 0%, #000 4%, transparent 66%);
  mask-image: radial-gradient(ellipse 56% 90% at 50% 0%, #000 4%, transparent 66%);
  pointer-events: none; z-index: 0;
}

/* ── page chrome: HUD header + source footer ──────────────────────── */
.shead { position: relative; z-index: 5; display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.actcap {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 2.4px; text-transform: uppercase; color: var(--ac);
  display: flex; align-items: center; gap: 9px; white-space: nowrap;
}
.actcap::before { content: ''; width: 18px; height: 2px; background: var(--ac); box-shadow: 0 0 8px var(--ac); }
.actname { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shead .spacer { flex: 1; }
.wordmark { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 3px; color: var(--text-mute); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.wordmark svg { display: block; }

.sfoot {
  position: relative; z-index: 5; margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: 16px;
}
.sfoot .src { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.4px; color: var(--text-mute); line-height: 1.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sfoot .src b { color: var(--text-dim); font-weight: 700; }
.sfoot .proof {
  flex-shrink: 0; font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: 1px;
  color: var(--violet); background: rgba(167,139,250,0.10); border: 1px solid rgba(167,139,250,0.30);
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
}
.sfoot .proof.gold { color: var(--gold); background: rgba(243,182,76,0.10); border-color: rgba(243,182,76,0.32); }
.sfoot .proof.green { color: var(--green); background: rgba(61,220,151,0.10); border-color: rgba(61,220,151,0.32); }
.sfoot .proof.red { color: var(--red); background: rgba(255,107,102,0.10); border-color: rgba(255,107,102,0.34); }
.sfoot .proof.cyan { color: var(--cyan); background: rgba(104,199,255,0.09); border-color: rgba(104,199,255,0.30); }
.sfoot .pgno { flex-shrink: 0; font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--text-mute); white-space: nowrap; }
.sfoot .pgno b { color: var(--text); font-weight: 700; }

.wrap { position: relative; z-index: 2; width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.wrap.top { justify-content: flex-start; }
.speaker-notes { display: none !important; }

/* ── type primitives ──────────────────────────────────────────────── */
.display { font-family: var(--font-display); font-style: normal; font-weight: 400; letter-spacing: -1.5px; line-height: 0.88; text-wrap: balance; overflow-wrap: anywhere; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); }
.note { font-family: var(--font-editorial); font-style: italic; color: var(--text-dim); }
.hair { height: 1px; background: var(--rule); border: 0; }

.tag {
  display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase; color: #070A0F; background: var(--tag-c, var(--accent));
  padding: 3px 9px; border-radius: 3px; white-space: nowrap;
}
.kick {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 2.8px;
  text-transform: uppercase; color: var(--kc, var(--accent)); display: block; margin-bottom: 13px;
}
.h2 { font-family: var(--font-display); font-style: normal; font-weight: 400; letter-spacing: -0.8px; line-height: 1.04; font-size: 46px; text-wrap: balance; }
.h2 .thin { color: var(--text-dim); }
.h2.sm { font-size: 38px; }
.lede { font-family: var(--font-editorial); font-size: 17px; line-height: 1.45; color: var(--text-dim); }
.lede b, .lede strong { color: var(--text); font-weight: 600; }
.lede code, .card code, .cb code, p code, li code {
  font-family: var(--font-mono); font-size: 0.82em; color: var(--cyan);
  background: rgba(104,199,255,0.08); padding: 1px 5px; border-radius: 3px;
}

/* gradient display words */
.grad-violet { background: linear-gradient(135deg, var(--violet), #fff 52%, var(--violet-deep)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.grad-gold   { background: linear-gradient(135deg, var(--gold), #fff 52%, #b9822a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.grad-cyan   { background: linear-gradient(135deg, var(--cyan), #fff 52%, #2f8fc9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.grad-green  { background: linear-gradient(135deg, var(--green), #fff 52%, #1f9a67); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

/* front-matter hero helpers (cover, dividers) */
.fm-rule { width: 46px; height: 3px; background: var(--accent); box-shadow: 0 0 22px var(--accent); }
.fm-hero { font-family: var(--font-display); font-size: 128px; letter-spacing: -3px; line-height: 0.92; text-wrap: balance; }
.fm-sub { font-family: var(--font-editorial); font-size: 18px; line-height: 1.5; color: var(--text-dim); max-width: 62ch; }
.fm-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.fm-list li { display: flex; align-items: baseline; gap: 12px; font-family: var(--font-body); font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }
.fm-list li b { color: var(--text); font-weight: 600; }
.fm-list .fm-n { font-family: var(--font-mono); font-size: 9px; color: var(--accent); letter-spacing: 1px; min-width: 34px; }

/* ── layout helpers ───────────────────────────────────────────────── */
.cols { display: grid; grid-template-columns: var(--cols, 1fr 1fr); gap: 34px; align-items: start; }
.cols.c2w { grid-template-columns: 1.25fr 1fr; }
.cols.c2l { grid-template-columns: 1fr 1.25fr; }
.cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.center { text-align: center; align-items: center; }

/* ── cards (3 / 4 / 8 grids) ──────────────────────────────────────── */
.cards { display: grid; gap: 16px; }
.cards.c2 { grid-template-columns: 1fr 1fr; }
.cards.c3 { grid-template-columns: 1fr 1fr 1fr; }
.cards.c4 { grid-template-columns: repeat(4, 1fr); }
.cards.c8 { grid-template-columns: repeat(4, 1fr); }
.card {
  position: relative; background: linear-gradient(165deg, var(--surface) 0%, #0C1119 100%);
  border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
  box-shadow: inset 0 1px 0 rgba(245,242,234,0.045), 0 22px 44px -30px rgba(0,0,0,0.85);
}
.card .ck { font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cc, var(--ac)); margin-bottom: 8px; display: block; }
.card .ct { font-family: var(--font-display); font-size: 19px; line-height: 1.08; letter-spacing: -0.3px; margin-bottom: 7px; }
.card .cb { font-size: 11px; line-height: 1.5; color: var(--text-dim); }
.card .cb b { color: var(--text); font-weight: 600; }
.card.acc-violet { --cc: var(--violet); border-color: rgba(167,139,250,0.24); }
.card.acc-cyan   { --cc: var(--cyan);   border-color: rgba(104,199,255,0.20); }
.card.acc-gold   { --cc: var(--gold);   border-color: rgba(243,182,76,0.24); }
.card.acc-green  { --cc: var(--green);  border-color: rgba(61,220,151,0.24); }
.card.acc-red    { --cc: var(--red);    border-color: rgba(255,107,102,0.26); }
.card.acc-silver { --cc: var(--silver); border-color: rgba(203,211,218,0.20); }
.card .big { font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: -1px; color: var(--cc, var(--text)); }

/* req tiles — model's three-col recap cards */
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.req {
  position: relative; border-radius: 16px; padding: 6px; --rq-c: var(--cyan);
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012) 45%, rgba(0,0,0,0.14)), var(--surface);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 26px 50px -28px rgba(0,0,0,0.65);
}
.req::before {
  content: ''; position: absolute; top: 0; left: 22px; right: 22px; height: 3px;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg, transparent, var(--rq-c) 30%, var(--rq-c) 70%, transparent);
  opacity: 0.9; z-index: 1;
}
.req-inner {
  position: relative; border-radius: 11px; height: 100%;
  background: linear-gradient(180deg, var(--surface2), var(--surface) 70%);
  border: 1px solid rgba(255,255,255,0.045); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  padding: 22px 22px; display: flex; flex-direction: column; gap: 12px;
}
.req-idx { font-family: var(--font-mono); font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--rq-c); }
.req-name { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--text); }
.req-note { font-family: var(--font-editorial); font-size: 13.5px; color: var(--text-dim); line-height: 1.42; margin-top: auto; }
.req-note b { color: var(--text); font-weight: 600; }
.req-proof { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-mute); }
.req-proof b { color: var(--rq-c); font-weight: 700; }
.req.red { --rq-c: var(--red); }
.req.violet { --rq-c: var(--violet); }
.req.gold { --rq-c: var(--gold); }
.req.green { --rq-c: var(--green); }

/* numbered instrument cards */
.rmgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; width: 100%; }
.rmcard {
  --rmc: var(--accent);
  position: relative; overflow: hidden; display: flex; flex-direction: column;
  border: 1px solid var(--border-bright); border-top: 3px solid var(--rmc); border-radius: 16px;
  background: linear-gradient(135deg, rgba(26,26,31,0.94), rgba(18,18,21,0.90));
  padding: 22px 24px 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 22px rgba(0,0,0,0.22);
}
.rmcard::before {
  content: ''; position: absolute; top: -70px; right: -70px; width: 240px; height: 240px; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--rmc) 20%, transparent) 0%, transparent 70%);
}
.rmcard > * { position: relative; z-index: 1; }
.rm-head { display: flex; align-items: center; gap: 16px; }
.rm-num {
  flex-shrink: 0; min-width: 42px; text-align: center;
  font-family: var(--font-display); font-style: normal; font-weight: 400;
  font-size: 40px; line-height: 0.9; letter-spacing: -0.02em;
  background: linear-gradient(180deg, var(--rmc) 30%, color-mix(in srgb, var(--rmc) 58%, #fff) 90%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.rm-eyebrow { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--rmc); }
.rm-name { font-family: var(--font-display); font-style: normal; letter-spacing: -0.3px; font-size: 22px; line-height: 1.08; color: var(--text); margin-top: 4px; }
.rm-when { flex: 1; font-family: var(--font-editorial); font-size: 13px; line-height: 1.42; color: var(--text-dim); margin-top: 12px; }
.rm-when b { color: var(--text); font-weight: 600; }
.rm-when code { font-family: var(--font-mono); font-style: normal; font-size: 0.85em; color: var(--cyan); }
.rm-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); }
.rm-pill {
  display: inline-block; font-family: var(--font-mono); font-size: 8px; font-weight: 800;
  letter-spacing: 1.6px; text-transform: uppercase; white-space: nowrap; color: #070A0F;
  background: var(--rmp, var(--rmc)); padding: 4px 11px; border-radius: 999px;
}

/* ── tokens, chips, badges ────────────────────────────────────────── */
.tok { display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; padding: 3.5px 10px; border-radius: 4px; background: rgba(167,139,250,0.13); color: var(--violet); border: 1px solid rgba(167,139,250,0.30); white-space: nowrap; }
.tok.violet { background: rgba(167,139,250,0.12); color: var(--violet); border-color: rgba(167,139,250,0.32); }
.tok.gold   { background: rgba(243,182,76,0.12);  color: var(--gold);  border-color: rgba(243,182,76,0.34); }
.tok.green  { background: rgba(61,220,151,0.12);  color: var(--green); border-color: rgba(61,220,151,0.34); }
.tok.red    { background: rgba(255,107,102,0.12); color: var(--red);   border-color: rgba(255,107,102,0.36); }
.tok.cyan   { background: rgba(104,199,255,0.10); color: var(--cyan);  border-color: rgba(104,199,255,0.30); }
.tok.silver { background: rgba(203,211,218,0.10); color: var(--silver); border-color: rgba(203,211,218,0.30); }
.tokset { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── tables ───────────────────────────────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
.tbl th { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ac); text-align: left; padding: 7px 12px; border-bottom: 1.5px solid var(--ac); }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--rule); color: var(--text-dim); line-height: 1.4; vertical-align: top; }
.tbl td b, .tbl td:first-child { color: var(--text); }
.tbl td:first-child { font-weight: 600; }
.tbl .num, .tbl th.num { text-align: right; font-family: var(--font-mono); }
.tbl tr.hl td { background: rgba(167,139,250,0.06); }
.tbl tr.redline td { background: rgba(255,107,102,0.07); }
.tbl.dense { font-size: 10px; }
.tbl.dense td { padding: 5px 10px; line-height: 1.32; }
.tbl.dense th { padding: 5px 10px; }
.tbl code { font-family: var(--font-mono); font-size: 0.9em; color: var(--cyan); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 8px; box-shadow: 0 0 10px -2px currentColor; }

/* ── callout / trap ───────────────────────────────────────────────── */
.callout {
  position: relative; border-radius: 13px; border: 1px solid var(--co-c, var(--accent));
  background: linear-gradient(135deg, color-mix(in srgb, var(--co-c, var(--accent)) 13%, transparent), transparent 70%), var(--surface);
  padding: 15px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.callout .co-k { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--co-c, var(--accent)); margin-bottom: 6px; }
.callout .co-b { font-family: var(--font-editorial); font-size: 15px; line-height: 1.42; color: var(--text); }
.callout .co-b b { color: var(--co-c, var(--accent)); font-weight: 600; }
.callout.green { --co-c: var(--green); }
.callout.red { --co-c: var(--red); }
.callout.gold { --co-c: var(--gold); }
.callout.cyan { --co-c: var(--cyan); }

.trap {
  position: relative; overflow: hidden;
  border: 1px solid rgba(255,107,102,0.5); border-radius: 16px;
  background: linear-gradient(140deg, rgba(255,107,102,0.17), rgba(255,107,102,0.02) 62%), var(--surface);
  padding: 18px 26px;
  box-shadow: 0 26px 62px -32px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 64px -26px rgba(255,107,102,0.55);
}
.trap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--red), transparent); }
.trap-k { font-family: var(--font-mono); font-size: 9.5px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--red); }
.trap-h { font-family: var(--font-display); font-style: normal; font-size: 26px; line-height: 1.06; color: #fff; margin-top: 10px; letter-spacing: -0.5px; }
.trap-h em { font-style: normal; color: var(--red); }
.trap-b { font-family: var(--font-editorial); font-size: 14px; line-height: 1.42; color: var(--text-dim); margin-top: 9px; }
.trap-b b { color: var(--text); font-weight: 600; }
.trap-b code { font-family: var(--font-mono); font-style: normal; font-size: 0.85em; color: var(--red); background: rgba(255,107,102,0.10); padding: 1px 5px; border-radius: 3px; }

/* ── pull quote ───────────────────────────────────────────────────── */
.pullquote { position: relative; padding-left: 28px; border-left: 2px solid var(--pq-c, var(--accent)); }
.pq-text { font-family: var(--font-display); font-style: normal; font-size: 34px; line-height: 1.12; color: var(--text); letter-spacing: -0.6px; text-wrap: balance; }
.pq-attr { display: flex; align-items: baseline; flex-wrap: wrap; gap: 13px; margin-top: 16px; }
.pq-dash { width: 28px; height: 1px; background: var(--pq-c, var(--accent)); transform: translateY(-5px); flex-shrink: 0; }
.pq-who { font-family: var(--font-editorial); font-size: 15px; color: var(--text); }
.pq-sep { color: var(--text-mute); font-size: 12px; }
.pq-gloss { font-family: var(--font-editorial); font-style: italic; font-size: 13px; color: var(--text-dim); }

/* ── code: macOS window ───────────────────────────────────────────── */
.code {
  position: relative; font-family: var(--font-mono); font-size: 11px; line-height: 1.8;
  background: #050507; border: 1px solid var(--border-bright); border-radius: 12px;
  padding: 34px 20px 20px; white-space: pre; overflow: hidden; color: #c8d0dc;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 18px 44px -26px rgba(0,0,0,0.8);
}
.code[data-lang]::before {
  content: attr(data-lang); position: absolute; z-index: 1; top: 9px; right: 18px;
  font-size: 8px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
  color: #070A0F; background: var(--lang-c, var(--violet)); padding: 3px 8px; border-radius: 3px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.code .c  { color: #4d5666; }   /* comment */
.code .k  { color: var(--violet); } /* key / keyword */
.code .s  { color: var(--gold); }   /* string — human-authored literal */
.code .n  { color: var(--cyan); }   /* number / contract value */
.code .g  { color: var(--green); }  /* verified / ready */
.code .r  { color: var(--red); }    /* failure / refusal */
.code .w  { color: var(--text); }
.code .cb { display: block; }
.code .hl { background: rgba(167,139,250,0.16); border-radius: 3px; box-shadow: 0 0 0 1px rgba(167,139,250,0.35); }
.code--mac {
  border-radius: 14px; padding-top: 54px;
  border-color: rgba(150,150,220,0.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 60px -30px rgba(0,0,0,0.85), 0 0 44px -22px rgba(124,92,224,0.35);
}
.mac-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 36px;
  display: flex; align-items: center; gap: 8px; padding: 0 15px;
  background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
  border-bottom: 1px solid rgba(255,255,255,0.08);
  border-radius: 13px 13px 0 0;
}
.mac-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 2px rgba(0,0,0,0.35); }
.mac-dot--r { background: #ff5f57; } .mac-dot--y { background: #febc2e; } .mac-dot--g { background: #28c840; }
.mac-title {
  position: absolute; left: 0; right: 0; padding: 0 96px; text-align: center; pointer-events: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: 1.6px; color: var(--text-dim);
}

/* ── vertical flow chain ──────────────────────────────────────────── */
.flow { display: flex; flex-direction: column; width: 100%; }
.fl-node {
  position: relative; border: 1px solid var(--border-bright); border-left: 3px solid var(--fc, var(--accent));
  border-radius: 11px;
  background: linear-gradient(100deg, color-mix(in srgb, var(--fc, var(--accent)) 10%, transparent), var(--surface) 74%);
  padding: 13px 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.fl-k { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--fc, var(--accent)); }
.fl-name { font-family: var(--font-display); font-style: normal; font-size: 22px; line-height: 1; color: var(--text); margin-top: 5px; letter-spacing: -0.2px; }
.fl-note { font-family: var(--font-editorial); font-style: italic; font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.35; }
.fl-note code { font-family: var(--font-mono); font-style: normal; font-size: 0.88em; color: var(--cyan); }
.fl-arrow { position: relative; height: 26px; margin-left: 20px; }
.fl-arrow::before { content: ''; position: absolute; left: 0; top: -1px; bottom: 4px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--fa, var(--rule)), var(--fb, var(--rule))); opacity: 0.85; }
.fl-arrow::after { content: ''; position: absolute; left: -3px; bottom: -2px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 7px solid var(--fb, var(--text-mute)); }
.fl-arrow.opt::before { background: none; border-left: 2px dashed var(--text-mute); width: 0; opacity: 0.7; }

/* ── horizontal flow chain (solid + dotted connectors) ────────────── */
.hflow { display: flex; align-items: stretch; width: 100%; }
.hf-node {
  flex: 1 1 0; position: relative; overflow: hidden; display: flex; flex-direction: column;
  border: 1px solid color-mix(in srgb, var(--hc, var(--accent)) 36%, transparent);
  border-top: 3px solid var(--hc, var(--accent)); border-radius: 16px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--hc, var(--accent)) 12%, transparent), rgba(13,15,21,0.96) 64%);
  padding: 18px 18px 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 44px -24px rgba(0,0,0,0.7);
}
.hf-node::before {
  content: ''; position: absolute; top: -78px; right: -78px; width: 220px; height: 220px; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--hc, var(--accent)) 22%, transparent) 0%, transparent 70%);
}
.hf-node > * { position: relative; z-index: 1; }
.hf-node.is-empty { border-top-color: var(--text-mute); border-style: dashed; background: rgba(255,255,255,0.02); }
.hf-node.is-gate { border-color: color-mix(in srgb, var(--hc) 55%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 52px -16px var(--hc); }
.hf-head { display: flex; align-items: center; gap: 12px; }
.hf-num {
  flex-shrink: 0; min-width: 36px; text-align: center;
  font-family: var(--font-display); font-size: 36px; line-height: .9; letter-spacing: -.03em;
  background: linear-gradient(180deg, var(--hc, var(--accent)) 28%, color-mix(in srgb, var(--hc, var(--accent)) 58%, #fff) 92%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hf-k { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--hc, var(--accent)); }
.hf-name { font-family: var(--font-display); font-size: 23px; line-height: 1; color: var(--text); margin-top: 4px; letter-spacing: -0.3px; }
.hf-note { font-family: var(--font-editorial); font-size: 12.5px; line-height: 1.38; color: var(--text-dim); margin-top: 10px; }
.hf-note b { color: var(--text); font-weight: 600; font-style: normal; }
.hf-tag { margin-top: auto; padding-top: 12px; font-family: var(--font-mono); font-size: 8px; font-weight: 800; letter-spacing: 1px; }
.hf-tag > span {
  display: inline-flex; max-width: 100%; padding: 4px 8px; border-radius: 3px; overflow-wrap: anywhere;
  background: var(--hc, var(--accent)); color: #050507; text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 18px -12px var(--hc, var(--accent));
}
.hf-arrow { flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 6px; }
.hf-al { font-family: var(--font-editorial); font-style: italic; font-size: 12px; line-height: 1.28; color: var(--ac, var(--text-mute)); text-align: center; white-space: nowrap; }
.hf-line { position: relative; width: 100%; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--af, var(--rule)), var(--ac, var(--rule))); opacity: 0.9; }
.hf-line::after { content: ''; position: absolute; right: -2px; top: -4px; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--ac, var(--text-mute)); }
/* dotted = optional / non-authoritative observation ONLY */
.hf-arrow.opt .hf-line { background: none; border-top: 2px dashed var(--text-mute); height: 0; opacity: 0.75; }
.hf-arrow.opt .hf-line::after { border-left-color: var(--text-mute); }
.hf-arrow.opt .hf-al { color: var(--text-mute); }

/* simple chip chain (cover folded rail, transition strips) */
.flowchain { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; }
.fc-node { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--fcc, var(--text)); border: 1px solid color-mix(in srgb, var(--fcc, var(--violet)) 45%, transparent); background: color-mix(in srgb, var(--fcc, var(--violet)) 9%, transparent); padding: 7px 14px; border-radius: 6px; white-space: nowrap; }
.fc-arrow { flex: 0 0 34px; position: relative; height: 2px; background: linear-gradient(90deg, var(--rule), var(--ac)); }
.fc-arrow::after { content: ''; position: absolute; right: -1px; top: -3.5px; border-left: 7px solid var(--ac); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }

/* ── panel fact rows ──────────────────────────────────────────────── */
.panel { border: 1px solid var(--border-bright); border-radius: 13px; background: var(--surface); padding: 16px 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
.panel + .panel { margin-top: 12px; }
.panel-k { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--pk, var(--accent)); margin-bottom: 4px; }
.pf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.pf:last-child { border-bottom: 0; padding-bottom: 0; }
.pf-l { font-family: var(--font-mono); font-size: 10.5px; color: var(--text); }
.pf-r { font-family: var(--font-editorial); font-style: italic; font-size: 12.5px; color: var(--text-dim); text-align: right; }
.pf-r b { color: var(--text); font-weight: 600; font-style: normal; }
.pf-r code { font-family: var(--font-mono); font-size: 0.88em; color: var(--cyan); font-style: normal; }

/* ── invariant strip ──────────────────────────────────────────────── */
.invariant { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.inv-cell { padding: 18px 24px; border-left: 1px solid var(--rule); }
.inv-cell:first-child { border-left: 0; }
.inv-verb { font-family: var(--font-display); font-size: 34px; line-height: 1; color: var(--ivc, var(--text)); }
.inv-who { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--text-dim); margin-top: 8px; }
.inv-gloss { font-family: var(--font-editorial); font-style: italic; font-size: 12.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.35; }

/* ── pin cards / pinmarks ─────────────────────────────────────────── */
.pinmark { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 7px; border-radius: 50%; background: var(--pinc, var(--violet)); color: #070A0F; font: 800 9px/1 var(--font-mono); vertical-align: middle; box-shadow: 0 0 10px -2px var(--pinc, var(--violet)); }
.pin-cards { display: flex; flex-direction: column; gap: 10px; }
.pin-card { --pinc: var(--violet); display: flex; gap: 11px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--pinc) 30%, transparent); border-left: 3px solid var(--pinc); border-radius: 11px; background: linear-gradient(120deg, color-mix(in srgb, var(--pinc) 7%, transparent), var(--surface) 70%); padding: 10px 14px; }
.pin-card .pinmark { margin: 2px 0 0; flex-shrink: 0; }
.pin-t { font: 400 16px/1.1 var(--font-display); color: var(--text); letter-spacing: -0.2px; }
.pin-b { margin-top: 3px; font: italic 400 11.5px/1.32 var(--font-editorial); color: var(--text-dim); }
.pin-b b { color: var(--text); font-weight: 600; font-style: normal; }

/* ── stat ─────────────────────────────────────────────────────────── */
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .sv { font-family: var(--font-display); font-size: 52px; line-height: 1; letter-spacing: -1px; color: var(--sac, var(--ac)); }
.stat .sk { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-mute); }

/* ── tick / cross lists ───────────────────────────────────────────── */
ul.tick { list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.tick li { position: relative; padding-left: 20px; font-size: 11.5px; line-height: 1.42; color: var(--text-dim); }
ul.tick li b { color: var(--text); font-weight: 600; }
ul.tick li::before { content: '—'; position: absolute; left: 0; color: var(--ac); font-weight: 700; }
ul.tick.check li::before { content: '✓'; color: var(--green); font-size: 10px; top: 1px; }
ul.tick.cross li::before { content: '✕'; color: var(--red); font-size: 9px; top: 1.5px; }
ul.tick.dense li { font-size: 10.5px; line-height: 1.36; }

/* ═══ CONVERGE book components ═══════════════════════════════════════ */

/* ── evidence ladder rows (P03) ───────────────────────────────────── */
.ladder { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.lrow {
  display: grid; grid-template-columns: 54px 148px minmax(0,1.05fr) minmax(0,1.5fr);
  gap: 16px; align-items: center; padding: 8.5px 4px;
  border-bottom: 1px solid var(--rule);
}
.lrow.head { padding: 6px 4px; border-bottom: 1.5px solid var(--ac); }
.lrow.head span { font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-mute); }
.lr-rank { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--text-mute); text-align: center; }
.lrow.top .lr-rank { color: var(--rc, var(--text)); }
.lr-badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 800; letter-spacing: 1px; color: var(--rc, var(--text)); }
.lr-badge .rk { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-size: 12px; background: color-mix(in srgb, var(--rc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--rc) 45%, transparent); box-shadow: 0 0 14px -6px var(--rc); }
.lr-surf { font-family: var(--font-mono); font-size: 9.5px; line-height: 1.5; color: var(--text-dim); }
.lr-use { font-family: var(--font-editorial); font-size: 11.5px; line-height: 1.35; color: var(--text-dim); }
.lr-use b { color: var(--text); font-weight: 600; }
.lrow.future { opacity: 0.72; }
.lrow.future .lr-rank, .lrow.future .lr-badge { color: var(--text-mute); }

/* W · CHECKOUT ONLY ribbon — mandatory on working-tree claims */
.wribbon {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  font-family: var(--font-mono); font-size: 9px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--silver); border: 1.5px dashed rgba(203,211,218,0.65); border-radius: 5px; padding: 4px 10px;
  background: repeating-linear-gradient(135deg, rgba(203,211,218,0.07) 0 6px, transparent 6px 12px);
}
.wribbon .rk { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: var(--silver); color: #070A0F; font-size: 9.5px; }
.wribbon.big { font-size: 13px; letter-spacing: 2.6px; padding: 10px 18px; border-width: 2px; }
.wribbon.big .rk { width: 24px; height: 24px; font-size: 13px; }

/* ── receipt stack (P13, P06 preview) ─────────────────────────────── */
.rstack { display: flex; flex-direction: column; gap: 9px; }
.rcpt {
  --rc2: var(--violet);
  position: relative; display: grid; grid-template-columns: 168px minmax(0,1fr) auto; gap: 14px; align-items: baseline;
  border: 1px solid color-mix(in srgb, var(--rc2) 32%, transparent); border-left: 3px solid var(--rc2);
  border-radius: 10px; padding: 10px 16px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--rc2) 8%, transparent), var(--surface) 72%);
  box-shadow: 0 14px 30px -22px rgba(0,0,0,0.8);
}
.rstack .rcpt:nth-child(2) { margin-left: 14px; } .rstack .rcpt:nth-child(3) { margin-left: 28px; }
.rstack .rcpt:nth-child(4) { margin-left: 42px; } .rstack .rcpt:nth-child(5) { margin-left: 56px; }
.rstack .rcpt:nth-child(6) { margin-left: 70px; }
.rcpt .rc-k { font-family: var(--font-mono); font-size: 8.5px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--rc2); }
.rcpt .rc-v { font-family: var(--font-display); font-size: 16.5px; line-height: 1.1; color: var(--text); }
.rcpt .rc-v small { display: block; font-family: var(--font-editorial); font-style: italic; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
.rcpt .rc-q { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1px; color: var(--text-mute); text-transform: uppercase; white-space: nowrap; }

/* ── descent rail: passes 0–8, barrier gate, bypass arcs ──────────── */
.drail { position: relative; padding-top: 74px; }
.drail-row { position: relative; display: flex; align-items: stretch; }
.drail-row::before { content: ''; position: absolute; left: 1%; right: 1%; top: 50%; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--gold) 52%, var(--violet) 56%, var(--green)); opacity: 0.55; box-shadow: 0 0 12px rgba(167,139,250,0.4); }
.dnode {
  position: relative; z-index: 1; flex: 1 1 0; margin: 0 5px; text-align: center;
  border: 1px solid var(--border); border-top: 3px solid var(--dc, var(--violet)); border-radius: 10px;
  background: linear-gradient(180deg, var(--surface2), var(--surface)); padding: 11px 4px 10px;
}
.dnode .dn-num { font-family: var(--font-mono); font-size: 9px; font-weight: 800; letter-spacing: 1.4px; color: var(--dc, var(--violet)); }
.dnode .dn-name { font-family: var(--font-body); font-size: 11.5px; font-weight: 600; color: var(--text); margin-top: 3px; }
.dnode .dn-sub { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.8px; color: var(--text-mute); margin-top: 3px; text-transform: uppercase; }
.dnode.human { --dc: var(--cyan); }
.dnode.machine { --dc: var(--violet); }
.dnode.opt { border-style: dashed; border-top-style: solid; }
/* the Pass 4 barrier gate — gold, human authority */
.dnode.gate { --dc: var(--gold); border-color: rgba(243,182,76,0.55); margin-top: -16px; padding-top: 27px; box-shadow: 0 0 34px -10px rgba(243,182,76,0.55), inset 0 1px 0 rgba(255,255,255,0.07); }
.dnode.gate::before { content: '⛨ BARRIER · HUMAN'; position: absolute; top: 7px; left: 0; right: 0; font-family: var(--font-mono); font-size: 7px; font-weight: 800; letter-spacing: 1.4px; color: var(--gold); }
/* dotted bypass arcs above optional hops — set left/right inline */
.darc { position: absolute; top: 16px; border: 2px dashed var(--text-mute); border-bottom: 0; border-radius: 12px 12px 0 0; height: 30px; opacity: 0.75; }
.darc > span { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 7.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-mute); white-space: nowrap; }
.drail-legend { display: flex; gap: 22px; margin-top: 14px; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 1px; color: var(--text-mute); text-transform: uppercase; }
.drail-legend b { font-weight: 700; }
.drail-legend .lg { display: flex; align-items: center; gap: 7px; }
.drail-legend .lg::before { content: ''; width: 14px; height: 3px; border-radius: 2px; background: var(--lgc, var(--violet)); }
.drail-legend .lg.dashed::before { height: 0; border-top: 2px dashed var(--text-mute); background: none; }

/* ── terminal-state cards (P49 8-matrix, P06 preview) ─────────────── */
.term { --tc: var(--green); position: relative; border: 1px solid color-mix(in srgb, var(--tc) 34%, transparent); border-top: 3px solid var(--tc); border-radius: 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 9%, transparent), var(--surface) 66%); padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; }
.term .t-name { font-family: var(--font-mono); font-size: 12.5px; font-weight: 800; letter-spacing: 1px; color: var(--tc); }
.term .t-gloss { font-family: var(--font-editorial); font-size: 11px; line-height: 1.35; color: var(--text-dim); }
.term .t-foot { margin-top: auto; padding-top: 7px; display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-mute); }
.term .t-exit { font-weight: 800; color: #070A0F; background: var(--tc); border-radius: 3px; padding: 2px 7px; }
.term.bad { --tc: var(--red); }
.term.warn { --tc: var(--gold); }
.term.neutral { --tc: var(--silver); }

/* ── corridor rails (release / main / working tree) ───────────────── */
.corridor { display: flex; flex-direction: column; gap: 10px; }
.rail { --rlc: var(--violet); display: grid; grid-template-columns: 210px minmax(0,1fr) auto; gap: 16px; align-items: center; border: 1px solid color-mix(in srgb, var(--rlc) 30%, transparent); border-left: 3px solid var(--rlc); border-radius: 10px; padding: 11px 18px; background: linear-gradient(100deg, color-mix(in srgb, var(--rlc) 8%, transparent), var(--surface) 70%); }
.rail .rl-k { font-family: var(--font-mono); font-size: 9px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--rlc); }
.rail .rl-k small { display: block; font-weight: 500; letter-spacing: 0.6px; color: var(--text-mute); margin-top: 3px; text-transform: none; }
.rail .rl-v { font-family: var(--font-mono); font-size: 11px; color: var(--text); line-height: 1.5; }
.rail .rl-v .dim { color: var(--text-mute); }
.rail .rl-tag { font-family: var(--font-mono); font-size: 8px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--rlc); white-space: nowrap; }
.rail.dotted { border-style: dashed; border-left-style: solid; }

/* ── lanes (everyday vs factory) ──────────────────────────────────── */
.lanes { display: flex; flex-direction: column; gap: 14px; }
.lane { --lnc: var(--silver); border: 1px solid color-mix(in srgb, var(--lnc) 30%, transparent); border-left: 3px solid var(--lnc); border-radius: 13px; background: linear-gradient(100deg, color-mix(in srgb, var(--lnc) 7%, transparent), var(--surface) 72%); padding: 14px 20px; }
.lane .ln-k { font-family: var(--font-mono); font-size: 9px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; color: var(--lnc); margin-bottom: 8px; }

/* ── steel-thread specimen card ───────────────────────────────────── */
.specimen { border: 1px solid rgba(167,139,250,0.4); border-radius: 13px; background: linear-gradient(150deg, rgba(167,139,250,0.10), rgba(13,15,21,0.96) 60%); padding: 14px 20px; box-shadow: 0 0 44px -18px rgba(167,139,250,0.5), inset 0 1px 0 rgba(255,255,255,0.06); }
.specimen .sp-id { font-family: var(--font-mono); font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: var(--violet); }
.specimen .sp-sub { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-mute); margin-top: 3px; }

/* ── 7-beat emotional arc strip ───────────────────────────────────── */
.beats { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.beat { padding: 12px 12px 11px; border-left: 1px solid var(--rule); }
.beat:first-child { border-left: 0; }
.beat .b-n { font-family: var(--font-mono); font-size: 8px; font-weight: 800; letter-spacing: 1.6px; color: var(--text-mute); }
.beat .b-t { font-family: var(--font-display); font-size: 17px; line-height: 1.05; color: var(--bc, var(--text)); margin-top: 5px; }
.beat .b-g { font-family: var(--font-editorial); font-style: italic; font-size: 9.5px; line-height: 1.3; color: var(--text-mute); margin-top: 4px; }

/* ── mermaid ──────────────────────────────────────────────────────── */
.mmd { display: flex; justify-content: center; align-items: center; width: 100%; min-width: 0; }
.mmd.frame { background: #05080D; border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
.mermaid { display: flex; justify-content: center; align-items: center; max-width: 100%; }
.mermaid, .mermaid * { box-sizing: content-box; } /* global border-box breaks mermaid label measurement */
.mermaid svg { max-width: 100%; max-height: var(--mmd-h, 600px); height: auto; display: block; }
.mermaid .edgeLabel, .mermaid .label { font-family: 'Fira Code', monospace !important; }

/* ── cover extras ─────────────────────────────────────────────────── */
.cover-icon { filter: drop-shadow(0 24px 48px rgba(0,0,0,0.5)) drop-shadow(0 0 34px rgba(167,139,250,0.35)); }
.ghost { position: absolute; z-index: 0; pointer-events: none; font-family: var(--font-display); font-style: italic; line-height: 0.85; opacity: 0.03; white-space: nowrap; color: var(--violet); }
</style>

<script src="assets/mermaid.min.js"></script>
<script>
/* Mermaid boot — Converge palette, error-collecting.
   shoot.js waits on window.__mermaidErrors / rendered svg per .mermaid node. */
window.__mermaidErrors = [];
mermaid.initialize({
  startOnLoad: false,
  securityLevel: 'loose',
  suppressErrorRendering: true,
  theme: 'base',
  themeVariables: {
    background: 'transparent',
    primaryColor: '#18152a',
    primaryBorderColor: '#A78BFA',
    primaryTextColor: '#F5F2EA',
    secondaryColor: '#0f1922',
    tertiaryColor: '#0d1117',
    lineColor: '#8f969f',
    textColor: '#F5F2EA',
    mainBkg: '#18152a',
    nodeBorder: '#A78BFA',
    clusterBkg: '#0d1117',
    clusterBorder: '#29313A',
    edgeLabelBackground: '#070A0F',
    fontFamily: "'Fira Code', monospace",
    fontSize: '14px'
  },
  flowchart: { htmlLabels: true, curve: 'linear', padding: 8 }
});
document.addEventListener('DOMContentLoaded', async function () {
  var els = document.querySelectorAll('.mermaid');
  for (var i = 0; i < els.length; i++) {
    try {
      await mermaid.run({ nodes: [els[i]] });
    } catch (e) {
      window.__mermaidErrors.push({ index: i, message: String((e && e.message) || e) });
    }
  }
});
</script>
